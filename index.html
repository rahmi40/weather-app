<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background: #0d9488;
        min-height: 100vh;
      }

      .glass-card {
        background: linear-gradient(
          135deg,
          rgba(20, 184, 166, 0.6) 0%,
          rgba(99, 102, 241, 0.7) 100%
        );
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
      }

      .fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .search-btn {
        transition: all 0.2s ease;
      }
      .search-btn:hover {
        background: rgba(255, 255, 255, 0.3);
      }
      .search-btn:active {
        transform: scale(0.95);
      }

      .forecast-card {
        transition: transform 0.2s ease;
      }
      .forecast-card:hover {
        transform: translateY(-4px);
      }

      .spin {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-sm rounded-3xl p-6 md:p-8">
      <div class="flex items-center gap-3 mb-8">
        <div
          class="flex-1 bg-white rounded-full px-5 py-3 flex items-center shadow-sm"
        >
          <input
            type="text"
            id="cityInput"
            placeholder="Search city..."
            class="w-full bg-transparent text-slate-700 placeholder-slate-400 outline-none text-sm"
          />
        </div>
        <button
          id="searchBtn"
          class="search-btn w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-md"
        >
          <img
            src="images/Magnifying glass.png"
            alt="Search"
            class="w-5 h-5 object-contain"
            style="pointer-events: none"
          />
        </button>
      </div>

      <div id="statusBox" class="text-center py-10 text-white/70">
        <p class="text-sm">Type a city name and search</p>
      </div>

      <div id="weatherBox" class="hidden">
        <div id="weatherIcon" class="flex justify-center mb-4"></div>

        <div class="text-center mb-1">
          <span
            id="tempDisplay"
            class="text-7xl font-light text-white tracking-tight"
          ></span>
        </div>

        <div class="text-center mb-8">
          <p id="cityDisplay" class="text-2xl text-white/90 font-medium"></p>
        </div>

        <div class="flex justify-center gap-10 mb-8">
          <div class="flex items-center gap-3">
            <img
              src="images/water drop.png"
              alt="Humidity"
              class="w-7 h-7 object-contain"
            />
            <div>
              <p
                id="humidityDisplay"
                class="text-white text-lg font-semibold leading-tight"
              ></p>
              <p class="text-white/60 text-xs">Humidity</p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <img
              src="images/wind lines.png"
              alt="Wind"
              class="w-7 h-7 object-contain"
            />
            <div>
              <p
                id="windDisplay"
                class="text-white text-lg font-semibold leading-tight"
              ></p>
              <p class="text-white/60 text-xs">Wind Speed</p>
            </div>
          </div>
        </div>

        <div>
          <p
            class="text-white/50 text-xs uppercase tracking-wider mb-3 text-center"
          >
            5-Day Forecast
          </p>
          <div id="forecastGrid" class="grid grid-cols-5 gap-2"></div>
        </div>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
